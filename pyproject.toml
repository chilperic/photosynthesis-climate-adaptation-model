[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photosynthesis-adaptation"
version = "0.1.0"
description = "Coupled C3/C4 photosynthesis, heat, hydraulics, sensitivity, and evolutionary adaptation model."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  {name = "Chilperic Armel Foko Kuate"}
]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=1.5",
  "matplotlib>=3.7",
  "casadi>=3.6",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "SALib>=1.4",
  "cma>=3.3",
  "joblib>=1.3",
  "tqdm>=4.66",
  "plotly>=5.18",
  "seaborn>=0.13"
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.4"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photosynthesis_adaptation = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
